# Builds a Mac release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0)
# and puts it in a draft GitHub release. Nothing reaches anyone until the draft is published:
# the update feed and the website link follow the latest published release. docs/updates.md
# lists the secrets and variables this needs.
name: Release Mac app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    # Needs an Xcode at least as new as the one Margin is built with (XCODE_VERSION).
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MARGIN_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose Xcode
        run: |
          XCODE="/Applications/Xcode_${{ vars.XCODE_VERSION }}.app"
          if [[ ! -d "$XCODE" ]]; then
            echo "Xcode ${{ vars.XCODE_VERSION }} isn't on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Production settings
        env:
          LOCAL_XCCONFIG: ${{ secrets.MARGIN_LOCAL_XCCONFIG }}
        run: |
          [[ -n "$LOCAL_XCCONFIG" ]] || { echo "Set the MARGIN_LOCAL_XCCONFIG secret"; exit 1; }
          printf '%s\n' "$LOCAL_XCCONFIG" > Apps/Config/Margin.local.xcconfig
          echo "MARGIN_VERSION=${MARGIN_VERSION#v}" >> "$GITHUB_ENV"

      - name: Signing certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: App Store Connect key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MARGIN_GITHUB_REPO: ${{ github.repository }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "Set the SPARKLE_PRIVATE_KEY secret"; exit 1; }
          scripts/release-mac.sh

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=".build/release/$MARGIN_VERSION"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Margin $MARGIN_VERSION" --generate-notes \
            "$OUT/Margin.dmg" "$OUT/Margin.zip" "$OUT/appcast.xml" "$OUT/margin.rb"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: .build/release/*/*.log

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" Apps/Config/Margin.local.xcconfig
